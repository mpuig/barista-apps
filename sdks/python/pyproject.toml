[project]
name = "barista-app-sdk"
version = "0.1.0a1"
description = "Provider-neutral Python SDK for the Barista Host API: capability negotiation, idempotent lifecycle, streams, attach, and harness adapters. Runs unchanged against a local provider or Barista Cloud."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jsonschema[format]>=4.20",
]

[project.optional-dependencies]
ws = ["websockets>=12.0"]
test = [
    "pytest>=8.0",
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jsonschema[format]>=4.20",
]

[tool.hatch.build.targets.wheel]
packages = ["barista_app_sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

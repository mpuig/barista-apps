name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  openspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install OpenSpec CLI
        run: npm install -g @fission-ai/openspec

      - name: Validate active changes
        run: |
          for change in openspec/changes/*/; do
            id="$(basename "$change")"
            [ "$id" = "archive" ] && continue
            openspec validate "$id" --strict
          done

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Golden contract tests (offline)
        working-directory: contracts/tests
        run: uv run pytest -q

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Conformance suite self-tests (offline)
        working-directory: conformance
        run: uv run --extra test pytest -q

[project]
name = "barista-local-provider"
version = "0.1.0a1"
description = "Single-user reference Host API provider over a local barista.sh Node Agent. No Barista Cloud, no proprietary dependency."
requires-python = ">=3.10"
dependencies = [
    "starlette>=0.37",
    "uvicorn>=0.30",
    "jsonschema[format]>=4.20",
]

[project.scripts]
barista-local-provider = "barista_local_provider.__main__:main"

[project.optional-dependencies]
# gRPC Node Agent client (production backend). Requires the kernel's generated
# `barista-proto` package, which is not published to PyPI — install it from
# github.com/mpuig/barista.sh (py/barista-proto) alongside this extra.
grpc = ["grpcio>=1.60"]
test = ["pytest>=8.0", "httpx>=0.27", "jsonschema[format]>=4.20", "pyyaml>=6.0"]

[tool.hatch.build.targets.wheel]
packages = ["barista_local_provider"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

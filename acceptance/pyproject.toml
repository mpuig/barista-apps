[project]
name = "barista-acceptance"
version = "0.1.0a1"
description = "Offline standalone and opt-in managed-provider acceptance flows."
requires-python = ">=3.10"
dependencies = [
    "barista-app-sdk",
    "barista-local-provider",
    "barista-conformance",
    "barista-app-pi",
    "barista-app-factory",
    "barista-app-change-agent",
    "barista-app-lift",
    "barista-app-story",
    "httpx>=0.27",
    "pytest>=8.0",
    "uvicorn>=0.30",
]

[project.scripts]
barista-managed-smoke = "barista_managed_smoke:main"

[tool.hatch.build.targets.wheel]
packages = ["barista_managed_smoke"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
barista-app-sdk = { path = "../sdks/python", editable = true }
barista-local-provider = { path = "../providers/local", editable = true }
barista-conformance = { path = "../conformance", editable = true }
barista-app-pi = { path = "../apps/pi", editable = true }
barista-app-factory = { path = "../apps/factory", editable = true }
barista-app-change-agent = { path = "../apps/change-agent", editable = true }
barista-app-lift = { path = "../apps/lift", editable = true }
barista-app-story = { path = "../apps/story", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: real elapsed-time acceptance excluded from the default run",
]

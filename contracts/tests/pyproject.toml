[project]
name = "barista-contracts-tests"
version = "0.0.0"
description = "Golden/compatibility tests for the Barista open contracts (App Manifest, Host API, Session Story)."
requires-python = ">=3.10"
dependencies = [
    "jsonschema[format]>=4.20",
    "pyyaml>=6.0",
    "openapi-spec-validator>=0.7",
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["."]

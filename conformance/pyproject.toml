[project]
name = "barista-conformance"
version = "0.1.0a1"
description = "Black-box conformance suite for Barista Host API providers. Proves a provider preserves portable app semantics and advertises only what it supports."
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "jsonschema[format]>=4.20",
    "pyyaml>=6.0",
]

[project.scripts]
barista-conformance = "barista_conformance.__main__:main"

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["barista_conformance"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
